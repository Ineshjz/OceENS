name: CI

on:
  push:
    branches: [course-2026-fallback-clean-bench]
  pull_request:

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run tach check
      - run: uv run python scripts/check_cycles.py