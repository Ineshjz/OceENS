services:
  oceens:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # LOCAL_DATABASE_DIR in .env names the host folder mounted below; inside
      # the container, the database must stay in the mount point.
      LOCAL_DATABASE_DIR: /app/database
    volumes:
      - ${LOCAL_DATABASE_DIR:-./database}:/app/database
      - ./import:/app/import
    restart: always
